# Optional analytics storage. `docker compose -f deploy/docker-compose.yml up -d`
# Postgres = trade journal (schema/postgres), ClickHouse = market firehose (schema/clickhouse).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: copybot
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: copybot
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ../schema/postgres:/docker-entrypoint-initdb.d:ro
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - ch:/var/lib/clickhouse
      - ../schema/clickhouse:/docker-entrypoint-initdb.d:ro
volumes:
  pg: {}
  ch: {}
