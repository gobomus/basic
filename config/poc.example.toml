# copybot FREE PROOF-OF-CONCEPT configuration.
#   cp config/poc.example.toml config/copybot.toml      # git-ignored
#   export RPC_URL=https://api.mainnet-beta.solana.com   # or a free Helius / Alchemy / dRPC URL
#   copybot check && copybot run
#
# Costs nothing and risks nothing:
#   - paper mode: no money moves, fills are simulated at the price the pool has
#     when our transaction would have landed (see [infra.paper]);
#   - free data feed: the standard RPC WebSocket, no paid streaming plan;
#   - no tips, no paid senders.
# Add 3-10 leader wallets, let it run for days, then `copybot report`.
# When the report shows a real edge, switch to config/copybot.example.toml
# (paid gRPC + senders, shadow mode first) and optimise for latency.

mode = "paper"

default_exit = "ladder_trail"
# Every one of these is replayed on the same entries and prices and scored by
# `copybot report`, so one run compares all exit styles.
shadow_exits = ["mirror_leader", "fast_scalp", "moonbag"]

[sizing]
mode = "leader_pct"        # leader_pct | balance_fraction | fixed
copy_pct = 0.10            # copy 10% of the leader's SOL size
min_buy_sol = 0.02
max_buy_sol = 0.25
max_pool_impact_pct = 0.01 # never more than 1% of the pool's SOL
follow_adds = true
max_adds = 2

[filters]
min_leader_buy_sol = 0.3   # ignore dust and test buys
max_leader_buy_sol = 200.0
# The free feed can price Pump.fun curve coins and PumpSwap pools straight from
# their accounts, so exits work there. Other venues need the paid feed.
venues = ["pump_fun_curve", "pump_swap"]
min_pool_sol = 10.0
one_entry_per_token = false
blacklist_mints = []
blacklist_devs = []
max_token_age_secs = 604800
# The free feed sees a trade 1-3 s after it lands (a slot is 0.4 s). The price
# drift check below is the real protection against buying after the move.
max_detection_slot_lag = 12
max_price_drift_pct = 0.20

[risk]
max_position_sol = 0.5
max_total_exposure_sol = 2.0
max_open_positions = 6
min_sol_reserve = 0.05
daily_loss_limit_sol = 1.0
max_buy_slippage_bps = 1500
max_sell_slippage_bps = 3000

# ---------------------------------------------------------------- exit policies

[exits.ladder_trail]
stop_loss_pct = 0.35
take_profit = [
  { at_multiple = 1.8, sell_fraction = 0.40 },
  { at_multiple = 3.5, sell_fraction = 0.30 },
]
trailing = { activate_at_multiple = 1.4, drawdown_pct = 0.30 }
max_hold_secs = 14400
stale_secs = 1800
on_leader_sell = { action = "tighten", drawdown_pct = 0.12 }
exit_on_dev_sell = true
liquidity_drop_pct = 0.40

# Baseline: behave like a classic copy bot. Every other policy is judged against it.
[exits.mirror_leader]
stop_loss_pct = 0.50
on_leader_sell = { action = "mirror" }

[exits.fast_scalp]
stop_loss_pct = 0.20
take_profit = [{ at_multiple = 1.35, sell_fraction = 1.0 }]
max_hold_secs = 600
on_leader_sell = { action = "sell_all" }
exit_on_dev_sell = true

[exits.moonbag]
stop_loss_pct = 0.45
take_profit = [
  { at_multiple = 2.0, sell_fraction = 0.50 },
  { at_multiple = 5.0, sell_fraction = 0.25 },
]
trailing = { activate_at_multiple = 5.0, drawdown_pct = 0.45 }
on_leader_sell = { action = "ignore" }
liquidity_drop_pct = 0.50

# ---------------------------------------------------------------- leaders
# Find candidates on GMGN / Axiom / KOLscan, then vet each one on-chain, free:
#   copybot leader-report <WALLET>     (profit, win rate, hold time, bot check)

[[leaders]]
address = "REPLACE_WITH_LEADER_WALLET_1"
label = "leader-1"

[[leaders]]
address = "REPLACE_WITH_LEADER_WALLET_2"
label = "leader-2"

# ================================================================ infrastructure

[infra]
rpc_url_env = "RPC_URL"
feed_stale_secs = 10                 # slot updates arrive ~2.5 per second
control_socket = "data/copybot.sock" # copybot ctl status | positions | stop ...

[infra.ws]                           # the free feed
# url_env = "WS_URL"                 # default: RPC_URL with https -> wss
commitment = "confirmed"             # earliest point a transaction can be fetched
poll_ms = 1200                       # price check of open positions
idle_poll_ms = 10000                 # closed positions still tracked for exit scoring

[infra.paper]
latency_ms = 1200                    # detection -> our transaction landing. Honest default for the free feed.
afterlife_secs = 1800                # keep tracking closed positions this long to score alternative exits

[[infra.senders]]                    # used only in live mode
name = "rpc"
url = "https://api.mainnet-beta.solana.com"
accepts_jito_tip = false

[infra.fees]
cu_limit_buy = 150000                # measured on mainnet: 75-91k compute units
cu_limit_sell = 130000
cu_price_micro_lamports = 100000     # priority fee: ~0.00002 SOL per transaction
tip_lamports_buy = 0                 # no tips in the free POC
tip_lamports_sell = 0
urgent_tip_multiplier = 1

[infra.wallet]
keystore = "keys/hot-1.json"         # only needed for live mode
passphrase_env = "KEYSTORE_PASSPHRASE"

[infra.storage]
journal_dir = "data/journal"         # every signal, fill and exit, one JSON per line
