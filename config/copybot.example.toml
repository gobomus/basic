[infra.fees]
cu_limit_buy = 260000
cu_limit_sell = 220000
cu_price_micro_lamports = 300000     # priority fee
tip_lamports_buy = 1000000           # 0.001 SOL
tip_lamports_sell = 1000000
urgent_tip_multiplier = 3            # stop-loss / dev-dump / liquidity-pull exits

[infra.wallet]
keystore = "keys/hot-1.json"         # created by: copybot wallet new --out keys/hot-1.json
