[infra.storage]
journal_dir = "data/journal"         # always on: JSONL of every signal, order, fill, exit
postgres_url_env = "DATABASE_URL"    # optional: schema/postgres/001_state.sql
clickhouse_url = ""                  # optional: http://host:8123 for schema/clickhouse

[infra.gmgn]                         # GMGN OpenAPI (key from gmgn.ai → API); token + wallet intelligence
api_key_env = "GMGN_API_KEY"
requests_per_sec = 4
enrich = true                        # log GMGN's token panel (holders, dev, snipers, bundlers, insiders,
